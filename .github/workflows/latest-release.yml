name: Latest Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: portfinder-linux
            binary_name: portfinder
          - os: windows-latest
            artifact_name: portfinder-windows
            binary_name: portfinder.exe
          - os: macos-latest
            artifact_name: portfinder-macos
            binary_name: portfinder

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt
        pip install -e .

    - name: Build with PyInstaller
      run: |
        pyinstaller --clean --distpath=dist portfinder.spec

    - name: Test binary
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          ./dist/portfinder.exe --help
        else
          chmod +x ./dist/portfinder
          ./dist/portfinder --help
        fi
      shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.binary_name }}

  update-latest-release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Get current date
      id: date
      run: echo "date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT

    - name: Delete existing latest release
      uses: dev-drprasad/delete-tag-and-release@v1.1
      with:
        tag_name: latest
        github_token: ${{ secrets.GITHUB_TOKEN }}
        delete_release: true
      continue-on-error: true

    - name: Create or Update Latest Release
      uses: ncipollo/release-action@v1
      with:
        tag: latest
        name: Latest Build
        body: |
          # Latest Build from Main Branch
          
          This release is automatically updated with the latest binaries from the main branch.
          
          **⚠️ Note**: These are development builds and may be unstable.
          
          ## Downloads
          
          - **Linux**: `portfinder-linux`
          - **Windows**: `portfinder-windows.exe`
          - **macOS**: `portfinder-macos`
          
          ### Installation
          
          #### Linux/macOS:
          ```bash
          chmod +x portfinder-*
          sudo mv portfinder-* /usr/local/bin/portfinder
          ```
          
          #### Windows:
          Move `portfinder-windows.exe` to a directory in your PATH or run it directly.
          
          ### Usage
          
          ```bash
          # List all processes binding to ports
          portfinder
          
          # Filter specific ports
          portfinder 8080 3000
          
          # Kill processes on specific ports
          portfinder --kill 8080
          ```
          
          ---
          Built from commit: ${{ github.sha }}
          Build date: ${{ steps.date.outputs.date }}
        artifacts: |
          artifacts/portfinder-linux/portfinder
          artifacts/portfinder-windows/portfinder.exe
          artifacts/portfinder-macos/portfinder
        artifactContentType: application/octet-stream
        allowUpdates: true
        makeLatest: false
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}